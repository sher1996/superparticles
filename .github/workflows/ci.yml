name: CI

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4

    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'

    - name: Install dependencies
      run: npm ci

    - name: Type check
      run: npm run typecheck

    # Also enforces the gzipped bundle budget
    - name: Build
      run: npm run build

    - name: Unit tests
      run: npm test

    - name: Install Chromium
      run: npx playwright install --with-deps chromium

    - name: Browser tests
      run: npm run test:browser

    # Real WebGPU compute shaders via Dawn + Chromium's SwiftShader Vulkan driver
    - name: WebGPU compute tests
      run: npm run test:webgpu

    - name: Upload build artifacts
      uses: actions/upload-artifact@v4
      with:
        name: dist
        path: dist/
