name: Release

# Publishes to npm when a version tag is pushed, e.g.:
#   npm version 0.2.0-alpha.1 && git push --follow-tags
# Requires a repository secret NPM_TOKEN (an npm "Automation" token).
on:
  push:
    tags: [ 'v*' ]

permissions:
  contents: read
  id-token: write # npm provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4

    - uses: actions/setup-node@v4
      with:
        node-version: '22'
        cache: 'npm'
        registry-url: 'https://registry.npmjs.org'

    - run: npm ci
    - run: npm run typecheck
    - run: npm run build
    - run: npm test

    - name: Check the tag matches package.json
      run: |
        tag="${GITHUB_REF_NAME#v}"
        version="$(node -p "require('./package.json').version")"
        if [ "$tag" != "$version" ]; then
          echo "Tag v$tag does not match package.json version $version"
          exit 1
        fi

    - name: Publish
      run: |
        version="$(node -p "require('./package.json').version")"
        # Pre-releases (anything with a hyphen) go to the "next" tag, not "latest"
        if [[ "$version" == *-* ]]; then tag=next; else tag=latest; fi
        npm publish --provenance --access public --tag "$tag"
      env:
        NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
