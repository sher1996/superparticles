<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Today's Opportunities</title>
  <link rel="stylesheet" href="/static/style.css">
</head>
<body>
<header class="top" id="header"></header>
<main>
  <div id="banners"></div>
  <div class="toolbar">
    <select id="date" aria-label="Run date"></select>
    <div class="tabs" id="tabs">
      <button data-s="new" class="active">To review<span class="count" id="c-new"></span></button>
      <button data-s="approved">Approved<span class="count" id="c-approved"></span></button>
      <button data-s="rejected">Rejected<span class="count" id="c-rejected"></span></button>
      <button data-s="all">All</button>
    </div>
    <label class="check"><input type="checkbox" id="printable"> Printable on my Roland only</label>
  </div>
  <div id="list"></div>
  <details class="filtered" id="filtered-box" style="display:none">
    <summary id="filtered-title"></summary>
    <ul id="filtered"></ul>
  </details>
</main>
<script src="/static/common.js"></script>
<script>
const state = { status: "new", date: null, printable: false };

function partsHtml(parts) {
  const names = { demand: "Demand growth", earliness: "Earliness", competition: "Weak competition", profit: "Profit", match: "Match" };
  return `<div class="parts">${Object.entries(names).map(([k, n]) => {
    const v = parts[k] ?? 0;
    return `<span>${n}</span><span class="bar"><i style="width:${Math.round(v * 100)}%"></i></span><span class="num">${Math.round(v * 100)}</span>`;
  }).join("")}</div>`;
}

function stageChip(d) {
  const st = d.stage;
  if (st === "early") return `<span class="chip good">Early trend</span>`;
  if (st === "growing") return `<span class="chip info">Growing</span>`;
  return `<span class="chip warn">Late</span>`;
}

function card(o, i) {
  const d = o.demand || {}, comp = d.competition || {}, p = o.profit || {}, a = o.ali, pr = o.print || {};
  const risk = o.risk || {};
  const chips = [stageChip(d), `<span class="chip ${comp.level === "weak" ? "good" : comp.level === "strong" ? "bad" : "warn"}">${esc(comp.level || "?")} competition</span>`];
  if (o.printable) chips.push(`<span class="chip info" title="${esc(pr.reason)}">🖨 Printable on Roland</span>`);
  if (o.learning_adj) chips.push(`<span class="chip">${o.learning_adj > 0 ? "▲" : "▼"} ${Math.abs(o.learning_adj)} learned</span>`);
  if (o.explanation_source === "ai") chips.push(`<span class="chip">AI explanation</span>`);
  const compRows = (o.competitors || []).map((c) => `<tr>
      <td class="n">${c.position}${c.weak_listing ? '<span title="Weak listing: short title, no photo or few reviews" style="color:var(--warn)">*</span>' : ""}</td>
      <td class="t" title="${esc(c.title)}">${c.url ? `<a href="${esc(c.url)}" target="_blank" rel="noopener">${esc(c.title)}</a>` : esc(c.title)}</td>
      <td class="n">${eur(c.price)}</td><td class="n">${int(c.offers)}</td><td class="n">${int(c.reviews)}</td>
      <td class="n">${c.rank ? "#" + c.rank : "–"}</td><td class="n">${int(c.impressions)}</td></tr>`).join("");
  const lines = (p.lines || []).map((l) => `<tr><td>${esc(l.label)}</td><td class="n">${eur(l.amount)}</td></tr>`).join("");
  const notes = (risk.notes || []).map((n) => `<li>${esc(n)}</li>`).join("");
  const decided = o.status !== "new";
  return `<article class="card" id="o${o.id}">
    <div class="card-head">
      <div class="rank">#${i + 1}</div>
      <div class="title-block">
        <h2>${esc(o.keyword)}</h2>
        ${o.also_keywords.length ? `<div class="also">Also searched as: ${o.also_keywords.map(esc).join(", ")}</div>` : ""}
        <div class="chips">${chips.join("")}</div>
      </div>
      ${partsHtml(o.parts || {})}
      <div class="score"><div class="big num">${Math.round(o.score)}</div><div class="lbl">score</div></div>
    </div>
    <div class="card-body">
      <div class="cell">
        <h3>bol search volume per week</h3>
        <div class="chart-slot"></div>
        <dl class="kv" style="margin-top:6px">
          <dt>Last 4 weeks vs 4 before</dt><dd>${pct(d.growth_4w)}</dd>
          <dt>vs same weeks last year</dt><dd>${pct(d.yoy)}</dd>
          <dt>Avg searches / week</dt><dd>${int(Math.round(d.avg_weekly || 0))}</dd>
        </dl>
      </div>
      <div class="cell">
        <h3>bol competitors (top ${comp.products || 0})</h3>
        <div class="comp-wrap"><table class="comp">
          <thead><tr><th class="n">#</th><th>Product</th><th class="n">Price</th><th class="n">Sellers</th><th class="n">Reviews</th><th class="n">Rank</th><th class="n">Impr.</th></tr></thead>
          <tbody>${compRows}</tbody></table></div>
        ${(o.competitors || []).some((c) => c.weak_listing) ? '<div style="font-size:12px;color:var(--muted);margin-top:4px"><span style="color:var(--warn)">*</span> weak listing (short title, no photo or few reviews). Rank/impressions = yesterday, from bol Insights.</div>' : '<div style="font-size:12px;color:var(--muted);margin-top:4px">Rank/impressions = yesterday, from bol Insights.</div>'}
      </div>
      <div class="cell">
        <h3>AliExpress match</h3>
        ${a ? `<div class="ali">
          <img src="${esc(a.image_url)}" alt="" loading="lazy">
          <div><div class="t"><a href="${esc(a.url)}" target="_blank" rel="noopener">${esc(a.title)}</a></div>
          <dl class="kv" style="margin-top:6px">
            <dt>Price</dt><dd>${eur(a.price)}</dd>
            <dt>Recent sales</dt><dd>${int(a.volume)}</dd>
            <dt>Rating</dt><dd>${a.rating ? a.rating.toFixed(1) + " / 5" : "–"}</dd>
            ${a.delivery_days ? `<dt>Delivery</dt><dd>~${a.delivery_days} days</dd>` : ""}
          </dl></div></div>
          <div class="conf"><b>Match confidence ${Math.round(o.match_confidence * 100)}%</b> (${esc(o.match_source)}) – ${esc(o.match_reason)}</div>`
        : "<p>No match</p>"}
      </div>
    </div>
    <div class="card-foot">
      <div class="profit">
        <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px">Profit per unit</h3>
        <div class="big num ${p.profit < 0 ? "neg" : ""}">${eur(p.profit)}</div>
        <div style="color:var(--text-2);font-size:13px">${pct(p.margin, false)} margin · sell at ${eur(p.sale_price)} · ROI ${pct(p.roi, false)}</div>
        <details><summary>Show calculation</summary>
          <table class="lines">${lines}<tr class="total"><td>You keep</td><td class="n">${eur(p.profit)}</td></tr></table>
          ${p.shipping_estimated ? '<div style="font-size:12px;color:var(--muted);margin-top:4px">Shipping is an estimate from Settings.</div>' : ""}
        </details>
      </div>
      <div class="explain">
        <h3 style="font-size:12px;text-transform:uppercase;letter-spacing:.05em;color:var(--muted);margin-bottom:4px">Why this score</h3>
        <p>${esc(o.explanation)}</p>
        ${notes ? `<b style="font-size:13px">Risk notes</b><ul class="notes">${notes}</ul>` : `<div style="font-size:13px;color:var(--good)">No risk flags found.</div>`}
        ${o.printable ? `<div class="print-box">🖨 <b>Print instead of import?</b> ${esc(pr.reason)}. Estimated own cost ~${eur(pr.print_cost)} per unit vs ${eur(p.landed_cost)} landed from AliExpress.</div>` : ""}
      </div>
    </div>
    <div class="actions">
      ${decided
        ? `<span class="decided">${o.status === "approved" ? "✅ Approved" : "❌ Rejected"}${o.decision_reason ? ": " + esc(o.decision_reason) : ""}</span>
           <button data-act="new">Undo</button>`
        : `<input type="text" placeholder="Reason (optional) – e.g. 'margin too low', 'too big', 'looks like a hype'" aria-label="Reason">
           <button class="reject" data-act="rejected">Reject</button>
           <button class="approve" data-act="approved">Approve</button>`}
    </div>
  </article>`;
}

async function load() {
  const q = new URLSearchParams({ status: state.status, printable: state.printable });
  if (state.date) q.set("date", state.date);
  const data = await api("/api/opportunities?" + q);
  const sel = $("#date");
  sel.innerHTML = (data.dates || []).map((d) => `<option ${d === data.date ? "selected" : ""}>${d}</option>`).join("");
  for (const s of ["new", "approved", "rejected"]) $("#c-" + s).textContent = data.counts[s] ? data.counts[s] : "";
  const list = $("#list");
  if (!data.date) {
    list.innerHTML = `<div class="empty"><h2>No results yet</h2><p>Click <b>Run now</b> to run the engine for the first time (takes a few seconds in demo mode).</p></div>`;
  } else if (!data.items.length) {
    list.innerHTML = `<div class="empty">Nothing here for ${esc(data.date)}${state.status === "new" ? " – all reviewed. 🎉" : "."}</div>`;
  } else {
    list.innerHTML = data.items.map(card).join("");
    data.items.forEach((o) => {
      const el = $(`#o${o.id} .chart-slot`);
      lineChart(el, o.chart.labels, [
        { name: "Last 52 weeks", values: o.chart.this_year, cls: "s1" },
        { name: "Same weeks last year", values: o.chart.last_year, cls: "sref" },
      ], { label: `Search volume for ${o.keyword}` });
      $(`#o${o.id} .actions`).addEventListener("click", async (ev) => {
        const btn = ev.target.closest("button[data-act]");
        if (!btn) return;
        const input = $(`#o${o.id} .actions input`);
        btn.disabled = true;
        try {
          await api(`/api/opportunities/${o.id}/decision`, { method: "POST", body: JSON.stringify({ decision: btn.dataset.act, reason: input ? input.value : "" }) });
          await load();
        } catch (e) { alert(e.message); btn.disabled = false; }
      });
    });
  }
  const fb = $("#filtered-box");
  if (data.filtered && data.filtered.length) {
    fb.style.display = "";
    $("#filtered-title").textContent = `Filtered out on ${data.date}: ${data.filtered.length} (risk, profit, match or duplicates)`;
    $("#filtered").innerHTML = data.filtered.map((f) => `<li><b>${esc(f.keyword)}</b> – ${f.reasons.map(esc).join("; ")}</li>`).join("");
  } else fb.style.display = "none";
}

function banners(s) {
  const b = [];
  if (s.mode === "demo") b.push(`<div class="banner warn"><b>Demo mode.</b> All market data is simulated so you can try the whole pipeline. Links and photos are placeholders. Switch to live in <code>.env</code> (<code>ENGINE_MODE=live</code>) once your accounts are approved – see README.</div>`);
  if (s.missing_for_live && s.missing_for_live.length) b.push(`<div class="banner bad"><b>Live mode is missing credentials:</b> ${s.missing_for_live.map(esc).join(", ")}. Add them to <code>.env</code> and restart.</div>`);
  const lr = s.last_run;
  if (lr && lr.summary && lr.summary.errors && lr.summary.errors.length) b.push(`<div class="banner bad"><b>The last run had problems:</b> ${esc(lr.summary.errors[0])} <a href="/settings#runs">See run log</a></div>`);
  $("#banners").innerHTML = b.join("");
}

$("#tabs").addEventListener("click", (ev) => {
  const btn = ev.target.closest("button");
  if (!btn) return;
  document.querySelectorAll("#tabs button").forEach((b) => b.classList.toggle("active", b === btn));
  state.status = btn.dataset.s;
  load();
});
$("#date").onchange = (ev) => { state.date = ev.target.value; load(); };
$("#printable").onchange = (ev) => { state.printable = ev.target.checked; load(); };
window.onRunFinished = async () => { state.date = null; banners(await refreshStatus()); load(); };

renderHeader("today").then(banners).then(load).catch((e) => { $("#list").innerHTML = `<div class="banner bad">${esc(e.message)}</div>`; });
</script>
</body>
</html>
