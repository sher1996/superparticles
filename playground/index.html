<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>SuperParticles Playground</title>
  <link rel="stylesheet" href="ui.css" />
</head>
<body>
  <canvas id="sp"></canvas>

  <aside id="panel">
    <section>
      <h3>Renderer</h3>
      <div class="row" role="group" aria-label="Renderer">
        <button id="renderer-canvas2d" data-renderer="canvas2d">Canvas2D</button>
        <button id="renderer-webgl2" data-renderer="webgl2">WebGL2</button>
        <button id="renderer-webgpu" data-renderer="webgpu">WebGPU</button>
      </div>
      <p id="renderer-note" class="note" hidden></p>
    </section>

    <section>
      <label class="slider-label" for="speed-slider">
        <span>Speed</span><span id="speed-value">40</span>
      </label>
      <input id="speed-slider" type="range" min="1" max="100" value="40" />
    </section>

    <section>
      <label class="slider-label" for="particle-count-slider">
        <span>Particles</span><span id="particle-count-value">1000</span>
      </label>
      <input id="particle-count-slider" type="range" min="100" max="20000" value="1000" step="100" />
    </section>

    <section>
      <label class="slider-label" for="particle-size-slider">
        <span>Size</span><span id="particle-size-value">2</span>
      </label>
      <input id="particle-size-slider" type="range" min="1" max="8" value="2" step="0.5" />
    </section>

    <section>
      <label class="check">
        <input id="deterministic-toggle" type="checkbox" />
        <span>Deterministic</span>
      </label>
    </section>

    <section>
      <label class="check">
        <span>Color</span>
        <input id="color-picker" type="color" value="#70c1ff" />
      </label>
    </section>

    <section>
      <h3>Plugins</h3>
      <div id="plugin-list"></div>
    </section>

    <section class="divider">
      <h3>Presets</h3>
      <div class="row">
        <button id="copy-preset" class="go">Copy URL</button>
        <button id="reset-preset" class="danger">Reset</button>
      </div>
    </section>

    <section class="divider">
      <div class="row">
        <button id="play-toggle" aria-pressed="true">Pause</button>
      </div>
      <div id="fps-display" class="note">FPS: --</div>
      <p class="note"><a href="./smart.html">Smart Particles (neural cellular automata) →</a></p>
    </section>
  </aside>

  <script type="module" src="./app.js"></script>
</body>
</html>
